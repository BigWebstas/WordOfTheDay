name: WordOfTheDay
options:
  bundleIdPrefix: com.example
targets:
  WordOfTheDay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [WordOfTheDay]
    info:
      path: WordOfTheDay/Info.plist
      properties:
        CFBundleDisplayName: Word of the Day
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.wordoftheday.refresh]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.wordoftheday
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
